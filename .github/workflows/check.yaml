name: compiler
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: make check
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-10-26'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make rtl-test
      - name: Exercise installed binary outside checkout, including spaces
        run: |
          cargo install --locked --path . --root /tmp/spatial-install
          cd /tmp
          /tmp/spatial-install/bin/spatial new 'spatial example'
          cd 'spatial example'
          /tmp/spatial-install/bin/spatial run
