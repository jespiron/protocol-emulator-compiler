id = "spatial"
name = "Spatial"
description = "Syntax highlighting for Spatial (.spt) hardware descriptions."
version = "0.1.0"
schema_version = 1
authors = ["Jessica Ruan <jess@standardkernel.com>"]
repository = "https://github.com/jespiron/protocol-emulator-compiler"

# Zed clones this repository at `rev` and builds the grammar in `path`.
# `rev` must be a pushed commit that contains editors/tree-sitter-spatial.
# Before that commit is pushed, try `repository = "file:///path/to/repo"` (untested).
[grammars.spatial]
repository = "https://github.com/jespiron/protocol-emulator-compiler"
rev = "8ebabd778226c0bc7341098f469279e372fc56ff"
path = "editors/tree-sitter-spatial"
