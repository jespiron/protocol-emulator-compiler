[project]
name = "spatial-compiler"
version = "0.1.0"
description = "Checked fabric configuration compiler for the PX8 spatial protocol emulator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spatialc = "spatial_compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "cocotb==2.0.1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/rtl/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests/test_compiler.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/rtl"
